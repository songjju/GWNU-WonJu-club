apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: club-platform-staging
  namespace: argocd
  labels:
    app: club-platform
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: club-platform

  source:
    repoURL: https://github.com/songjju/GWNU-WonJu-club
    targetRevision: develop
    path: manifests/overlays/staging
  
  destination:
    server: https://kubernetes.default.svc
    namespace: club-platform-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  revisionHistoryLimit: 10
  
  # 건강 상태 확인
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas