apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: club-platform
  namespace: argocd
  labels:
    project: club-platform
spec:
  description: "대학교 동아리 플랫폼 프로젝트"

  # 소스 리포지터리 허용 목록
  sourceRepos:
  - 'https://github.com/songjju/GWNU-WonJu-club'

  # 배포 대상 허용 목록
  destinations:
  - namespace: club-platform-staging
    server: https://kubernetes.default.svc
  - namespace: club-platform-production
    server: https://kubernetes.default.svc

  # 허용된 클러스터 리소스
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: PersistentVolume
  - group: 'networking.k8s.io'
    kind: Ingress

  # 허용된 네임스페이스 리소스
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: ReplicaSet
  - group: 'networking.k8s.io'
    kind: Ingress
  
  # RBAC 정책
  roles:
  - name: developer
    description: "개발자 권한"
    policies:
    - p, proj:club-platform:developer, applications, get, club-platform/*, allow
    - p, proj:club-platform:developer, applications, sync, club-platform/*, allow
    groups:
    - club-platform:developers
  
  - name: admin
    description: "관리자 권한"
    policies:
    - p, proj:club-platform:admin, applications, *, club-platform/*, allow
    - p, proj:club-platform:admin, repositories, *, *, allow
    groups:
    - club-platform:admins