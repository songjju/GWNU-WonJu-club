apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: club-platform-production
  labels:
    app: club-platform
    component: backend
    environment: production
data:
  # 비민감 환경변수들 (프로덕션용)
  DEBUG: "False"
  DB_NAME: "gwnu_club_db_production"
  DB_USER: "gwnu_user"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  ALLOWED_HOSTS: "club-platform.com,www.club-platform.com"
  CORS_ALLOWED_ORIGINS: "https://club-platform.com,https://www.club-platform.com"
  
  # 프로덕션 애플리케이션 설정
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_SIZE: "52428800"  # 50MB
  SESSION_TIMEOUT: "3600"      # 1시간
  
  # 보안 설정
  SECURE_SSL_REDIRECT: "True"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  SECURE_CONTENT_TYPE_NOSNIFF: "True"
  SECURE_BROWSER_XSS_FILTER: "True"