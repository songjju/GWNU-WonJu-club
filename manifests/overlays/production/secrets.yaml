apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: club-platform-production
  labels:
    app: club-platform
    component: backend
    environment: production
type: Opaque
stringData:
  # 이 값들은 CI/CD 파이프라인에서 실제 GitHub Secrets로 교체됩니다
  # 프로덕션 환경에서는 반드시 강력한 시크릿을 사용해야 합니다
  secret-key: "REPLACE_WITH_GITHUB_SECRET"
  email-host-user: "REPLACE_WITH_GITHUB_SECRET"  
  email-host-password: "REPLACE_WITH_GITHUB_SECRET"
  db-password: "REPLACE_WITH_GITHUB_SECRET"

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: club-platform-production
  labels:
    app: club-platform
    component: database
    environment: production
type: Opaque
stringData:
  # MySQL 관련 시크릿들 (프로덕션용)
  root-password: "REPLACE_WITH_GITHUB_SECRET"
  user-password: "REPLACE_WITH_GITHUB_SECRET"