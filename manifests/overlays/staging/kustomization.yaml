apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: club-platform-staging
  labels:
    app: club-platform
    environment: staging
    managed-by: kustomize

namespace: club-platform-staging

resources:
  - ../../base
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  # 시크릿 삭제

patchesStrategicMerge:
  - backend-patch.yaml
  - frontend-patch.yaml

namePrefix: staging-

commonLabels:
  environment: staging
  app: club-platform

# ImagePullBackOff 해결을 위한 이미지 설정
images:
  - name: backend-image
    newName: ghcr.io/songjju/gwnu-wonju-club/backend
    newTag: develop  # CI 파이프라인에서 실제 커밋 해시로 자동 업데이트됨
  - name: frontend-image
    newName: ghcr.io/songjju/gwnu-wonju-club/frontend
    newTag: develop  # CI 파이프라인에서 실제 커밋 해시로 자동 업데이트됨

# 공통 어노테이션
commonAnnotations:
  config.kubernetes.io/origin: |
    configuredBy: ClubPlatform GitOps Pipeline
    configuredOn: kustomize
  app.kubernetes.io/managed-by: kustomize
  deployment.kubernetes.io/revision: "1"