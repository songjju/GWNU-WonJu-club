apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: club-platform-staging

namespace: club-platform-staging

resources:
  - ../../base
  - namespace.yaml
  - secrets.yaml

patchesStrategicMerge:
  - backend-patch.yaml
  - frontend-patch.yaml

namePrefix: staging-

commonLabels:
  environment: staging

images:
  - name: backend-image
    newName: ghcr.io/songjju/gwnu-wonju-club/backend
    newTag: develop
  - name: frontend-image
    newName: ghcr.io/songjju/gwnu-wonju-club/frontend
    newTag: develop