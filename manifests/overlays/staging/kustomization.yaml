apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: club-platform-staging

namespace: club-platform-staging

resources:
  - ../../base
  - namespace.yaml
  - secrets.yaml

patchesStrategicMerge:
  - backend-patch.yaml
  - frontend-patch.yaml

namePrefix: staging-

commonLabels:
  environment: staging