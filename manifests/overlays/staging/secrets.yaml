apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: club-platform-staging
  labels:
    app: club-platform
    component: backend
    environment: staging
type: Opaque
stringData:
  # 이 값들은 CI/CD 파이프라인에서 실제 GitHub Secrets로 교체됩니다
  # 로컬 개발 시에는 scripts/update-secrets.sh 스크립트를 사용하세요
  secret-key: "REPLACE_WITH_GITHUB_SECRET"
  email-host-user: "REPLACE_WITH_GITHUB_SECRET"
  email-host-password: "REPLACE_WITH_GITHUB_SECRET"
  db-password: "REPLACE_WITH_GITHUB_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: club-platform-staging
  labels:
    app: club-platform
    component: database
    environment: staging
type: Opaque
stringData:
  # MySQL 관련 시크릿들
  root-password: "REPLACE_WITH_GITHUB_SECRET"
  user-password: "REPLACE_WITH_GITHUB_SECRET"