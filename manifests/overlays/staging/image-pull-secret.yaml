apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: club-platform-staging
  labels:
    app: club-platform
    environment: staging
    managed-by: github-actions
  annotations:
    description: "GitHub Container Registry (GHCR) access credentials"
    created-by: "GitHub Actions CI/CD Pipeline"
    purpose: "Resolve ImagePullBackOff errors for private GHCR images"
type: kubernetes.io/dockerconfigjson
data:
  # 이 값은 CI/CD 파이프라인에서 실제 Base64 인코딩된 Docker 설정으로 교체됩니다
  # 형식: {"auths":{"ghcr.io":{"username":"github-actor","password":"github-token","auth":"base64-auth"}}}
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKER_CONFIG