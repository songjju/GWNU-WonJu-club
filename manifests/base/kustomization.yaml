apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: club-platform-base

resources:
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - mysql-deployment.yaml
  - ingress.yaml

images:
  - name: backend-image
    newTag: latest
  - name: frontend-image
    newTag: latest

commonLabels:
  app: club-platform