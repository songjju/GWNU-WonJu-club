apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: club-platform
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: club-platform
      component: frontend
  template:
    metadata:
      labels:
        app: club-platform
        component: frontend
    spec:
      containers:
      - name: frontend
        image: frontend-image  # kustomize에서 교체됨
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "http://backend:8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: club-platform
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: club-platform
    component: frontend