# manifests/base/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: club-platform-network-policy
  labels:
    app: club-platform
spec:
  podSelector:
    matchLabels:
      app: club-platform
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # 프론트엔드 → 백엔드 통신 허용
  - from:
    - podSelector:
        matchLabels:
          app: club-platform
          component: frontend
    ports:
    - protocol: TCP
      port: 8000
  
  # 백엔드 → 데이터베이스 통신 허용
  - from:
    - podSelector:
        matchLabels:
          app: club-platform
          component: backend
    ports:
    - protocol: TCP
      port: 3306
  
  # Ingress 컨트롤러에서 프론트엔드/백엔드로의 접근 허용
  - from: []  # 모든 외부 트래픽 허용 (Ingress 통해)
    ports:
    - protocol: TCP
      port: 3000  # 프론트엔드
    - protocol: TCP
      port: 8000  # 백엔드
  
  egress:
  # DNS 쿼리 허용
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # 외부 API 호출 허용 (이메일 등)
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 587  # SMTP
    - protocol: TCP
      port: 25   # SMTP
  
  # 내부 서비스 간 통신 허용
  - to:
    - podSelector:
        matchLabels:
          app: club-platform
    ports:
    - protocol: TCP
      port: 3000  # 프론트엔드
    - protocol: TCP
      port: 8000  # 백엔드
    - protocol: TCP
      port: 3306  # 데이터베이스