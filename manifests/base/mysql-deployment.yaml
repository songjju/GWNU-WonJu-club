apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: club-platform
    component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: club-platform
      component: database
  template:
    metadata:
      labels:
        app: club-platform
        component: database
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staging-mysql-secrets
              key: root-password
        - name: MYSQL_DATABASE
          value: "gwnu_club_db"
        - name: MYSQL_USER
          value: "gwnu_user"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staging-mysql-secrets
              key: user-password
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - 'mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"'
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - 'mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"'
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: club-platform
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
  selector:
    app: club-platform
    component: database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app: club-platform
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi