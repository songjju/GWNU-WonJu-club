apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: club-platform
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: club-platform
      component: backend
  template:
    metadata:
      labels:
        app: club-platform
        component: backend
    spec:
      containers:
      - name: backend
        image: backend-image
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: staging-backend-secrets
              key: secret-key
        - name: DB_NAME
          value: "gwnu_club_db"
        - name: DB_USER
          value: "gwnu_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staging-backend-secrets
              key: db-password
        - name: DB_HOST
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: staging-backend-secrets
              key: email-host-user
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staging-backend-secrets
              key: email-host-password 
        - name: DEBUG
          value: "False"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: club-platform
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: club-platform
    component: backend

          
              