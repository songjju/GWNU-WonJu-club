[tool:pytest]
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=ai_chatbot/
    --ignore=ai_chatbot
    --ignore=*/ai_chatbot/*
    -v
norecursedirs = 
    ai_chatbot
    ai_chatbot/
    .git
    .tox
    .pytest_cache
    dist
    build
    *.egg
    __pycache__
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning