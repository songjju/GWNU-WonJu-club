[flake8]
max-line-length = 127
exclude = 
    .git,
    __pycache__,
    migrations,
    venv,
    .venv,
    settings.py
ignore = 
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    F401   # imported but unused (handled by isort)

[isort]
profile = black
multi_line_output = 3
line_length = 127
known_django = django
known_first_party = club_account,club_board,club_introduce,club_information,club_management,ai_chatbot
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,FIRSTPARTY,LOCALFOLDER

[coverage:run]
source = .
omit = 
    */migrations/*
    */venv/*
    */virtualenv/*
    manage.py
    */settings/*
    */tests/*
    */__pycache__/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError