name: 🚀 Fast CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 🧪 필수 테스트만 (병렬 실행)
  test:
    name: 🧪 Essential Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 백엔드 빠른 테스트
      - name: 🧪 Backend tests
        timeout-minutes: 5
        env:
          SECRET_KEY: test-key
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test --failfast

      # 프론트엔드 빠른 테스트
      - name: 🧪 Frontend tests
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --silent
          npm test -- --watchAll=false --passWithNoTests

  # 🐳 빌드 (테스트와 병렬)
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 12
    
    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG="${{ github.ref_name }}"
          
          echo "backend-image=${REGISTRY}/${REPO_LOWER}/backend:${BRANCH_TAG}" >> $GITHUB_OUTPUT
          echo "frontend-image=${REGISTRY}/${REPO_LOWER}/frontend:${BRANCH_TAG}" >> $GITHUB_OUTPUT

      # 백엔드 빌드 (병렬)
      - name: 🐳 Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend-image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend
          platforms: linux/amd64

      # 프론트엔드 빌드 (병렬)
      - name: 🐳 Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend-image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend
          platforms: linux/amd64

  # 🚀 수정된 배포
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Create secrets
        env:
          NAMESPACE: "club-platform-staging"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "🔐 시크릿 생성 시작..."
          
          # 네임스페이스 생성
          kubectl create namespace ${NAMESPACE} || echo "네임스페이스 이미 존재"
          
          # 시크릿들 삭제 후 재생성 (더 안전함)
          kubectl delete secret ghcr-secret staging-backend-secrets staging-mysql-secrets -n "${NAMESPACE}" || echo "기존 시크릿 없음"
          
          # ImagePullSecret
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITOPS_TOKEN }}" \
            --namespace="${NAMESPACE}"
          
          # Backend secrets
          kubectl create secret generic staging-backend-secrets \
            --from-literal=secret-key="${SECRET_KEY}" \
            --from-literal=email-host-user="${EMAIL_HOST_USER}" \
            --from-literal=email-host-password="${EMAIL_HOST_PASSWORD}" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}"
          
          # MySQL secrets
          kubectl create secret generic staging-mysql-secrets \
            --from-literal=root-password="${MYSQL_ROOT_PASSWORD}" \
            --from-literal=user-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}"
          
          echo "✅ 모든 시크릿 생성 완료"

      - name: 🚀 Update existing deployments (ArgoCD 호환)
        env:
          NAMESPACE: "club-platform-staging"
        run: |
          echo "🔧 기존 Deployment 설정 업데이트 중..."
          
          # MySQL 헬스체크만 업데이트
          kubectl patch deployment staging-mysql -n "${NAMESPACE}" --type='merge' -p='
          {
            "spec": {
              "template": {
                "spec": {
                  "containers": [
                    {
                      "name": "mysql",
                      "readinessProbe": {
                        "exec": {
                          "command": ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
                        },
                        "initialDelaySeconds": 30,
                        "periodSeconds": 10,
                        "timeoutSeconds": 5
                      },
                      "livenessProbe": {
                        "exec": {
                          "command": ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
                        },
                        "initialDelaySeconds": 60,
                        "periodSeconds": 30,
                        "timeoutSeconds": 10
                      }
                    }
                  ]
                }
              }
            }
          }' || echo "MySQL 패치 실패"
          
          # Backend 헬스체크 업데이트
          kubectl patch deployment staging-backend -n "${NAMESPACE}" --type='merge' -p='
          {
            "spec": {
              "template": {
                "spec": {
                  "containers": [
                    {
                      "name": "backend",
                      "readinessProbe": {
                        "httpGet": {
                          "path": "/health/",
                          "port": 8000
                        },
                        "initialDelaySeconds": 60,
                        "periodSeconds": 15,
                        "timeoutSeconds": 10,
                        "failureThreshold": 5
                      },
                      "livenessProbe": {
                        "httpGet": {
                          "path": "/health/",
                          "port": 8000
                        },
                        "initialDelaySeconds": 120,
                        "periodSeconds": 30,
                        "timeoutSeconds": 10,
                        "failureThreshold": 3
                      }
                    }
                  ]
                }
              }
            }
          }' || echo "Backend 패치 실패"
          
          # Frontend 헬스체크 업데이트
          kubectl patch deployment staging-frontend -n "${NAMESPACE}" --type='merge' -p='
          {
            "spec": {
              "template": {
                "spec": {
                  "containers": [
                    {
                      "name": "frontend",
                      "readinessProbe": {
                        "httpGet": {
                          "path": "/",
                          "port": 3000
                        },
                        "initialDelaySeconds": 30,
                        "periodSeconds": 15,
                        "timeoutSeconds": 10,
                        "failureThreshold": 5
                      },
                      "livenessProbe": {
                        "httpGet": {
                          "path": "/",
                          "port": 3000
                        },
                        "initialDelaySeconds": 60,
                        "periodSeconds": 30,
                        "timeoutSeconds": 10,
                        "failureThreshold": 3
                      }
                    }
                  ]
                }
              }
            }
          }' || echo "Frontend 패치 실패"

          echo "✅ 배포 완료 - 헬스체크 개선됨"

      - name: 🔍 배포 상태 확인
        env:
          NAMESPACE: "club-platform-staging"
        run: |
          echo "📋 배포 상태 확인 중..."
          
          # 잠시 대기 후 상태 확인
          sleep 30
          
          echo "🔍 Pod 상태:"
          kubectl get pods -n ${NAMESPACE}
          
          echo ""
          echo "🔍 서비스 상태:"
          kubectl get services -n ${NAMESPACE}
          
          echo ""
          echo "🔍 시크릿 상태:"
          kubectl get secrets -n ${NAMESPACE}