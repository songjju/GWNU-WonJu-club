name: 🚀 Fast CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 🧪 필수 테스트만 (병렬 실행)
  test:
    name: 🧪 Essential Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 백엔드 빠른 테스트
      - name: 🧪 Backend tests
        timeout-minutes: 5
        env:
          SECRET_KEY: test-key
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test --failfast

      # 프론트엔드 빠른 테스트
      - name: 🧪 Frontend tests
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --silent
          npm test -- --watchAll=false --passWithNoTests

  # 🐳 빌드 (테스트와 병렬)
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 12
    
    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG="${{ github.ref_name }}"
          
          echo "backend-image=${REGISTRY}/${REPO_LOWER}/backend:${BRANCH_TAG}" >> $GITHUB_OUTPUT
          echo "frontend-image=${REGISTRY}/${REPO_LOWER}/frontend:${BRANCH_TAG}" >> $GITHUB_OUTPUT

      # 백엔드 빌드 (병렬)
      - name: 🐳 Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend-image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend
          platforms: linux/amd64

      # 프론트엔드 빌드 (병렬)
      - name: 🐳 Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend-image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend
          platforms: linux/amd64

  # 🚀 간소화된 배포
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test, build]
    if: github.event_name == 'push'
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Create secrets
        env:
          NAMESPACE: "club-platform-${{ github.ref_name }}"
        run: |
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          
          # ImagePullSecret
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITOPS_TOKEN }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Backend secrets
          kubectl create secret generic staging-backend-secrets \
            --from-literal=secret-key="${{ secrets.SECRET_KEY }}" \
            --from-literal=email-host-user="${{ secrets.EMAIL_HOST_USER }}" \
            --from-literal=email-host-password="${{ secrets.EMAIL_HOST_PASSWORD }}" \
            --from-literal=db-password="${{ secrets.DB_PASSWORD }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # MySQL secrets
          kubectl create secret generic staging-mysql-secrets \
            --from-literal=root-password="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=user-password="${{ secrets.DB_PASSWORD }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🚀 Deploy apps
        env:
          NAMESPACE: "club-platform-${{ github.ref_name }}"
        run: |
          # 간단한 직접 배포 (Kustomize 제거로 시간 절약)
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: backend
                  image: ${{ needs.build.outputs.backend-image }}
                  ports:
                  - containerPort: 8000
                  env:
                  - name: SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: staging-backend-secrets
                        key: secret-key
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: staging-backend-secrets
                        key: db-password
                  - name: DB_HOST
                    value: "mysql-service"
                  - name: DB_NAME
                    value: "gwnu_club_db"
                  - name: DB_USER
                    value: "gwnu_user"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: backend
            ports:
            - port: 8000
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: frontend
                  image: ${{ needs.build.outputs.frontend-image }}
                  ports:
                  - containerPort: 3000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: frontend
            ports:
            - port: 3000
          EOF

          echo "✅ 배포 완료"