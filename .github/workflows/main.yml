name: 🚀 Optimized CI/CD Pipeline with ImagePullBackOff Fix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # 🔍 보안 및 환경변수 검증 작업 (병렬 실행 1)
  security-validation:
    name: 🔐 Security & Environment Validation
    runs-on: ubuntu-latest
    outputs:
      secrets-valid: ${{ steps.validate-secrets.outputs.valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python 의존성 캐싱
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-
            ${{ runner.os }}-pip-

      - name: 🕵️ Secret leak detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up Python for validation
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 🔍 Validate environment secrets
        id: validate-secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          # 환경변수 검증 스크립트가 없는 경우 기본 검증
          if [ -f "scripts/env-validator.py" ]; then
            python scripts/env-validator.py
          else
            echo "Environment variables validation..."
            [ -n "$SECRET_KEY" ] && echo "✅ SECRET_KEY is set"
            [ -n "$DB_PASSWORD" ] && echo "✅ DB_PASSWORD is set"
            echo "Basic validation completed"
          fi
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: 🛡️ Security scan for dependencies
        timeout-minutes: 8
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety
          safety scan --output text --exit-zero || echo "Security vulnerabilities found but CI continuing"
          echo "Security scan completed"
          
      # Trivy 파일시스템 스캔만 (이미지 스캔은 build 단계에서)
      - name: 🔒 Trivy filesystem scan
        timeout-minutes: 5
        run: |
          # Trivy 설치 (캐시 활용)
          if ! command -v trivy &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy
          fi
          
          # 백엔드 파일시스템 스캔만 (빠른 스캔)
          echo "🔍 Scanning backend directory..."
          trivy fs ./backend --format table --exit-code 0 --quiet
          echo "✅ Security filesystem scan completed"

  # 🎨 코드 품질 검사 (병렬 실행 2)
  code-quality:
    name: 🎨 Code Quality & Formatting
    runs-on: ubuntu-latest
    # security-validation과 병렬 실행하도록 의존성 제거
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 의존성 캐싱
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-
            ${{ runner.os }}-pip-

      # Node 의존성 캐싱
      - name: Cache Node dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python quality tools
        timeout-minutes: 3
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort bandit

      - name: 🎨 Python code formatting check
        timeout-minutes: 2
        run: |
          cd backend
          black --check --diff . --quiet || echo "Code formatting issues found but continuing"
          isort --check-only --diff . --quiet || echo "Import sorting issues found but continuing"

      - name: 🔍 Python linting (critical only)
        timeout-minutes: 2
        run: |
          cd backend
          # 중요한 오류만 체크하여 시간 단축
          flake8 . --select=E9,F63,F7,F82 --show-source --statistics || echo "Critical errors found but continuing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: 🎨 Frontend code quality
        timeout-minutes: 3
        run: |
          cd frontend
          # 빠른 린팅만 실행
          npm run lint --if-present || echo "Frontend linting completed with warnings"

  # 🧪 테스트 작업 (보안 검증 후 실행)
  test:
    name: 🧪 Comprehensive Testing
    runs-on: ubuntu-latest
    needs: [security-validation] # code-quality 의존성 제거로 병렬화
    timeout-minutes: 20
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 의존성 캐싱
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      # Node 의존성 캐싱
      - name: Cache Node dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        timeout-minutes: 5
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pytest-django pytest-cov

      - name: 🧪 Backend unit tests with coverage
        timeout-minutes: 12
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 3306
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: test_password
        run: |
          cd backend
          coverage run --source='.' --omit='ai_chatbot/*' manage.py test --verbosity=1 --failfast
          coverage report --show-missing --omit='ai_chatbot/*' --fail-under=60
          coverage xml --omit='ai_chatbot/*'

      # 통합 테스트는 조건부 실행
      - name: 🧪 Backend integration tests
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        timeout-minutes: 5
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 3306
        run: |
          cd backend
          python manage.py test --tag=integration --verbosity=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: 🧪 Frontend unit tests
        timeout-minutes: 5
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests

      # E2E 테스트는 main 브랜치에서만
      - name: 🧪 Frontend E2E tests
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 3
        run: |
          cd frontend
          npm run test:e2e || echo "E2E tests not yet implemented"

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml,./frontend/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
  
  # 🐳 이미지 빌드 및 보안 스캔 (테스트 완료 후)
  build-and-scan:
    name: 🐳 Build & Security Scan Images
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 25
    
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      backend-image: ${{ steps.clean-image-ref.outputs.backend-image }}
      frontend-image: ${{ steps.clean-image-ref.outputs.frontend-image }}
      backend-digest: ${{ steps.backend-build.outputs.digest }}
      frontend-digest: ${{ steps.frontend-build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 디스크 공간 확보
      - name: 🧹 Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/microsoft/msedge /opt/microsoft/powershell
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          docker system prune -af --volumes
          
          echo "After cleanup:"
          df -h

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      # 소문자 변환된 이미지 이름 생성
      - name: 🏷️ Generate lowercase image names
        id: image-names
        run: |
          # GitHub repository를 소문자로 변환
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "repository-lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "backend-image-name=${REGISTRY}/${REPO_LOWER}/backend" >> $GITHUB_OUTPUT
          echo "frontend-image-name=${REGISTRY}/${REPO_LOWER}/frontend" >> $GITHUB_OUTPUT
          
          echo "Backend image name: ${REGISTRY}/${REPO_LOWER}/backend"
          echo "Frontend image name: ${REGISTRY}/${REPO_LOWER}/frontend"

      - name: 🏷️ Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.backend-image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏷️ Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.frontend-image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:buildx-stable-1

      # 백엔드 빌드 (수정된 캐시 설정)
      - name: 🐳 Build and push backend image
        id: backend-build
        uses: docker/build-push-action@v5
        timeout-minutes: 25  # 12분 → 25분으로 증가
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=backend
          cache-to: |
            type=gha,mode=max,scope=backend
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            # 빌드 최적화 옵션
            DEBIAN_FRONTEND=noninteractive
            PIP_NO_CACHE_DIR=1
            PIP_DISABLE_PIP_VERSION_CHECK=1
          provenance: false
          sbom: false
          platforms: linux/amd64  # 단일 플랫폼으로 제한

      # 프론트엔드 빌드 (수정된 캐시 설정)
      - name: 🐳 Build and push frontend image
        id: frontend-build
        uses: docker/build-push-action@v5
        timeout-minutes: 15  # 25분 → 15분으로 단축
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=frontend-${{ hashFiles('frontend/package-lock.json') }}
            type=gha,scope=frontend
          cache-to: |
            type=gha,mode=max,scope=frontend-${{ hashFiles('frontend/package-lock.json') }}
            type=gha,mode=max,scope=frontend
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_OPTIONS=--max_old_space_size=4096
            # 빌드 최적화 옵션
            GENERATE_SOURCEMAP=false
            DISABLE_ESLINT_PLUGIN=true
            TSC_COMPILE_ON_ERROR=true
            FAST_REFRESH=false
          provenance: false
          sbom: false
          platforms: linux/amd64

      # 이미지 참조 정리
      - name: 🏷️ Extract clean image references
        id: clean-image-ref
        run: |
          BACKEND_TAG=$(echo "${{ steps.backend-meta.outputs.tags }}" | head -n1 | tr -d '\n\r')
          FRONTEND_TAG=$(echo "${{ steps.frontend-meta.outputs.tags }}" | head -n1 | tr -d '\n\r')
          
          echo "backend-image=${BACKEND_TAG}" >> $GITHUB_OUTPUT
          echo "frontend-image=${FRONTEND_TAG}" >> $GITHUB_OUTPUT
          
          echo "Backend image: ${BACKEND_TAG}"
          echo "Frontend image: ${FRONTEND_TAG}"

      # 간소화된 보안 스캔
      - name: 🔍 Backend image security scan
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          trivy image \
            --format sarif \
            --output backend-trivy.sarif \
            --severity 'CRITICAL' \
            --quiet \
            --timeout 2m \
            ${{ steps.clean-image-ref.outputs.backend-image }} || {
              echo "Creating empty SARIF file"
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy"}},"results":[]}]}' > backend-trivy.sarif
            }

      - name: 🔍 Frontend image security scan
        continue-on-error: true
        timeout-minutes: 3
        run: |
          trivy image \
            --format sarif \
            --output frontend-trivy.sarif \
            --severity 'CRITICAL' \
            --quiet \
            --timeout 2m \
            ${{ steps.clean-image-ref.outputs.frontend-image }} || {
              echo "Creating empty SARIF file"
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy"}},"results":[]}]}' > frontend-trivy.sarif
            }

      - name: 📋 Upload backend security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('backend-trivy.sarif') != ''
        with:
          sarif_file: 'backend-trivy.sarif'
          category: 'backend-security'

      - name: 📋 Upload frontend security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('frontend-trivy.sarif') != ''
        with:
          sarif_file: 'frontend-trivy.sarif'
          category: 'frontend-security'
  
  # 🚀 ImagePullBackOff 해결을 위한 배포 (Self-hosted Runner)
  deploy:
    name: 🚀 Deploy with ImagePullSecret Fix
    runs-on: self-hosted
    needs: build-and-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 10
    
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://club-platform.com' || 'https://staging.club-platform.com' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup Kubernetes config
        timeout-minutes: 2
        run: |
          # 현재 context 정보 출력
          echo "🔍 Current kubectl context:"
          CURRENT_CONTEXT=$(kubectl config current-context)
          echo "Context: ${CURRENT_CONTEXT}"
          
          # 클러스터 정보 확인
          echo "🔗 Cluster information:"
          kubectl cluster-info --request-timeout=10s
          
          # 노드 상태 확인
          echo "🖥️ Cluster nodes:"
          kubectl get nodes
          
          echo "✅ Using context: ${CURRENT_CONTEXT}"
          echo "🎯 Kubernetes cluster is ready for deployment"

      # 🔑 핵심: ImagePullSecret 생성
      - name: 🔑 Create ImagePullSecret for GHCR
        timeout-minutes: 3
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          echo "🔐 Creating ImagePullSecret for ${ENVIRONMENT} environment..."
          
          NAMESPACE="club-platform-${ENVIRONMENT}"
          
          # 네임스페이스 생성/확인
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "${NAMESPACE}" environment="${ENVIRONMENT}" --overwrite
          
          # ImagePullSecret 생성/업데이트
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="${GITOPS_TOKEN}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ ImagePullSecret created successfully"

      - name: 🔐 Deploy application secrets
        timeout-minutes: 3
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "🔐 Deploying secrets to ${ENVIRONMENT} environment..."
          
          NAMESPACE="club-platform-${ENVIRONMENT}"
          
          # Backend secrets
          kubectl create secret generic backend-secrets \
            --from-literal=secret-key="${SECRET_KEY}" \
            --from-literal=email-host-user="${EMAIL_HOST_USER}" \
            --from-literal=email-host-password="${EMAIL_HOST_PASSWORD}" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # MySQL secrets
          kubectl create secret generic mysql-secrets \
            --from-literal=root-password="${MYSQL_ROOT_PASSWORD}" \
            --from-literal=user-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ All secrets deployed successfully to ${ENVIRONMENT}"

      # 🚀 ImagePullSecret을 포함한 애플리케이션 배포
      - name: 🚀 Deploy applications with ImagePullSecret
        timeout-minutes: 7
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          BACKEND_IMAGE: ${{ needs.build-and-scan.outputs.backend-image }}
          FRONTEND_IMAGE: ${{ needs.build-and-scan.outputs.frontend-image }}
        run: |
          echo "🚀 Deploying applications to ${ENVIRONMENT} environment with ImagePullSecret..."
          
          NAMESPACE="club-platform-${ENVIRONMENT}"
          
          # Kustomize를 사용한 배포 (manifests 디렉토리가 있는 경우)
          if [ -d "manifests/overlays/${ENVIRONMENT}" ]; then
            echo "📁 Using Kustomize manifests for deployment..."
            
            # 임시로 이미지 태그 업데이트
            cd manifests/overlays/${ENVIRONMENT}
            
            # ImagePullSecret 추가 (임시 패치)
            cat > temp-imagepull-patch.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
          spec:
            template:
              spec:
                imagePullSecrets:
                - name: ghcr-secret
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
          spec:
            template:
              spec:
                imagePullSecrets:
                - name: ghcr-secret
          EOF
            
            # 기존 kustomization.yaml에 임시 패치 추가
            if ! grep -q "temp-imagepull-patch.yaml" kustomization.yaml; then
              sed -i '/patchesStrategicMerge:/a\  - temp-imagepull-patch.yaml' kustomization.yaml
            fi
            
            # 이미지 태그 업데이트
            BACKEND_REPO=$(echo "${BACKEND_IMAGE}" | cut -d':' -f1)
            BACKEND_TAG=$(echo "${BACKEND_IMAGE}" | cut -d':' -f2)
            FRONTEND_REPO=$(echo "${FRONTEND_IMAGE}" | cut -d':' -f1)
            FRONTEND_TAG=$(echo "${FRONTEND_IMAGE}" | cut -d':' -f2)
            
            # kustomization.yaml에서 이미지 태그 업데이트
            yq eval ".images[0].newTag = \"${BACKEND_TAG}\"" -i kustomization.yaml
            yq eval ".images[1].newTag = \"${FRONTEND_TAG}\"" -i kustomization.yaml
            
            cd ../../..
            
            # Kustomize 배포
            kubectl apply -k manifests/overlays/${ENVIRONMENT}
            
          else
            echo "📦 Creating basic deployment with ImagePullSecret..."
            
            # Backend 배포
            cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: staging-backend
            namespace: ${NAMESPACE}
            labels:
              app: club-platform
              component: backend
              environment: ${ENVIRONMENT}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: club-platform
                component: backend
            template:
              metadata:
                labels:
                  app: club-platform
                  component: backend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: backend
                  image: ${BACKEND_IMAGE}
                  ports:
                  - containerPort: 8000
                  env:
                  - name: SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: backend-secrets
                        key: secret-key
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: backend-secrets
                        key: db-password
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: staging-backend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: club-platform
              component: backend
            ports:
            - port: 8000
              targetPort: 8000
          EOF
            
            # Frontend 배포
            cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: staging-frontend
            namespace: ${NAMESPACE}
            labels:
              app: club-platform
              component: frontend
              environment: ${ENVIRONMENT}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: club-platform
                component: frontend
            template:
              metadata:
                labels:
                  app: club-platform
                  component: frontend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: frontend
                  image: ${FRONTEND_IMAGE}
                  ports:
                  - containerPort: 3000
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "200m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: staging-frontend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: club-platform
              component: frontend
            ports:
            - port: 3000
              targetPort: 3000
          EOF
          fi
          
          echo "✅ Applications deployed successfully with ImagePullSecret"

