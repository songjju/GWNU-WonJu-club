name: ⚡ Ultra-Fast CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # 🔥 변경 파일 감지 (모든 Job의 기준)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'
              - 'package*.json'
            docker:
              - '**/Dockerfile'
              - 'docker-compose.yml'
            docs:
              - '**.md'
              - 'docs/**'

  # 🔐 보안 검증 (병렬 실행 1)
  security-validation:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 빠른 시크릿 누출 검사
      - name: 🕵️ Quick secret leak detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

      # 환경변수 검증 (스크립트 없이)
      - name: 🔍 Validate environment secrets
        timeout-minutes: 1
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "🔍 Environment variables validation..."
          [ -n "$SECRET_KEY" ] && echo "✅ SECRET_KEY is set" || echo "❌ SECRET_KEY missing"
          [ -n "$DB_PASSWORD" ] && echo "✅ DB_PASSWORD is set" || echo "❌ DB_PASSWORD missing"
          [ -n "$MYSQL_ROOT_PASSWORD" ] && echo "✅ MYSQL_ROOT_PASSWORD is set" || echo "❌ MYSQL_ROOT_PASSWORD missing"
          echo "✅ Basic validation completed"

      # 빠른 파일시스템 스캔 (백엔드만)
      - name: 🔒 Quick filesystem scan
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 5
        run: |
          # Trivy 빠른 설치
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # 백엔드만 빠른 스캔
          trivy fs ./backend --format table --exit-code 0 --quiet --severity HIGH,CRITICAL
          echo "✅ Quick security scan completed"

  # 🎨 코드 품질 검사 (병렬 실행 2)
  code-quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 6
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 스마트 캐싱
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.local/lib/python3.12/site-packages
          key: quality-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'frontend/package-lock.json') }}
          restore-keys: |
            quality-${{ runner.os }}-
            quality-

      # 백엔드 품질 검사 (조건부)
      - name: 🐍 Backend code quality
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 3
        run: |
          cd backend
          
          # 최소한의 도구만 설치
          pip install --upgrade pip
          pip install flake8 black isort
          
          # 병렬 실행
          black --check --diff . --quiet &
          flake8 . --select=E9,F63,F7,F82 --quiet &
          isort --check-only --diff . --quiet &
          
          # 모든 검사 완료 대기
          wait
          echo "✅ Backend quality checks completed"

      # 프론트엔드 품질 검사 (조건부)
      - name: ⚛️ Frontend code quality
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 3
        run: |
          cd frontend
          
          # Node.js 설정
          export NODE_OPTIONS="--max-old-space-size=4096"
          
          # 빠른 설치
          npm ci --prefer-offline --no-audit --silent
          
          # 빠른 린팅
          npm run lint --if-present || echo "Linting completed with warnings"
          echo "✅ Frontend quality checks completed"

  # 🧪 빠른 테스트 (병렬 실행 3)
  quick-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 12
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 의존성 캐싱
      - name: Cache test dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.local/lib/python3.12/site-packages
            frontend/node_modules
          key: test-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'frontend/package-lock.json') }}
          restore-keys: |
            test-${{ runner.os }}-
            test-

      # 백엔드 테스트 (조건부)
      - name: 🐍 Backend tests
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 8
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 3306
        run: |
          cd backend
          
          # 빠른 설치
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage
          
          # 빠른 테스트 (실패 시 즉시 중단)
          python -m pytest --maxfail=5 -x --tb=short -q
          echo "✅ Backend tests completed"

      # 프론트엔드 테스트 (조건부)
      - name: ⚛️ Frontend tests
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 5
        run: |
          cd frontend
          
          # 빠른 설치
          npm ci --prefer-offline --no-audit --silent
          
          # 빠른 테스트
          npm test -- --passWithNoTests --watchAll=false --silent
          echo "✅ Frontend tests completed"

  # 🐳 이미지 빌드 (조건부 + 병렬)
  build:
    runs-on: ubuntu-latest
    needs: [changes, security-validation, code-quality, quick-tests]
    if: github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true')
    timeout-minutes: 18
    
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      backend-image: ${{ steps.backend-output.outputs.image }}
      frontend-image: ${{ steps.frontend-output.outputs.image }}
      backend-built: ${{ steps.backend-output.outputs.built }}
      frontend-built: ${{ steps.frontend-output.outputs.built }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 디스크 공간 확보
      - name: 🧹 Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          docker system prune -af

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:buildx-stable-1

      # 백엔드 빌드 (조건부)
      - name: 🐳 Build backend image
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true'
        id: backend-build
        uses: docker/build-push-action@v5
        timeout-minutes: 10
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          cache-from: |
            type=gha,scope=backend
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:cache
          cache-to: |
            type=gha,mode=max,scope=backend
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # 프론트엔드 빌드 (조건부)
      - name: 🐳 Build frontend image
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
        id: frontend-build
        uses: docker/build-push-action@v5
        timeout-minutes: 8
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          cache-from: |
            type=gha,scope=frontend
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:cache
          cache-to: |
            type=gha,mode=max,scope=frontend
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # 빌드 결과 출력
      - name: 📋 Set build outputs
        id: backend-output
        run: |
          if [[ "${{ steps.backend-build.outcome }}" == "success" ]]; then
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Set frontend outputs
        id: frontend-output
        run: |
          if [[ "${{ steps.frontend-build.outcome }}" == "success" ]]; then
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
          fi

  # 🔍 백그라운드 보안 스캔 (비차단)
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.outputs.backend-built == 'true' || needs.build.outputs.frontend-built == 'true')
    continue-on-error: true  # 스캔 실패해도 배포 진행
    timeout-minutes: 10
    
    steps:
      - name: 🔍 Quick image security scan
        timeout-minutes: 8
        run: |
          # Trivy 설치
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # 병렬 스캔 (백그라운드)
          if [[ "${{ needs.build.outputs.backend-built }}" == "true" ]]; then
            trivy image --severity HIGH,CRITICAL --quiet ${{ needs.build.outputs.backend-image }} &
          fi
          
          if [[ "${{ needs.build.outputs.frontend-built }}" == "true" ]]; then
            trivy image --severity HIGH,CRITICAL --quiet ${{ needs.build.outputs.frontend-image }} &
          fi
          
          # 모든 스캔 완료 대기
          wait
          echo "✅ Security scans completed"

  # 🚀 초고속 배포 (Self-hosted)
  deploy:
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && (needs.build.outputs.backend-built == 'true' || needs.build.outputs.frontend-built == 'true')
    timeout-minutes: 8
    
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://club-platform.com' || 'https://staging.club-platform.com' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup Kubernetes config
        timeout-minutes: 1
        run: |
          # 현재 context 확인
          CURRENT_CONTEXT=$(kubectl config current-context)
          echo "✅ Using context: ${CURRENT_CONTEXT}"
          
          # 빠른 연결 테스트
          kubectl get nodes --request-timeout=10s
          echo "🎯 Kubernetes cluster ready"

      - name: 🔐 Deploy secrets (quick)
        timeout-minutes: 2
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          NAMESPACE="club-platform-${ENVIRONMENT}"
          
          # 빠른 네임스페이스 생성
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          
          # 빠른 시크릿 배포 (병렬)
          kubectl create secret generic backend-secrets \
            --from-literal=secret-key="${SECRET_KEY}" \
            --from-literal=email-host-user="${EMAIL_HOST_USER}" \
            --from-literal=email-host-password="${EMAIL_HOST_PASSWORD}" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f - &
          
          kubectl create secret generic mysql-secrets \
            --from-literal=root-password="${MYSQL_ROOT_PASSWORD}" \
            --from-literal=user-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f - &
          
          wait
          echo "✅ Secrets deployed"

      - name: 🚀 Lightning-fast deployment
        timeout-minutes: 4
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend-image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend-image }}
          BACKEND_BUILT: ${{ needs.build.outputs.backend-built }}
          FRONTEND_BUILT: ${{ needs.build.outputs.frontend-built }}
        run: |
          NAMESPACE="club-platform-${ENVIRONMENT}"
          
          # 백엔드 배포 (조건부)
          if [[ "${BACKEND_BUILT}" == "true" ]]; then
            echo "🚀 Deploying backend: ${BACKEND_IMAGE}"
            kubectl set image deployment/backend-app backend-app=${BACKEND_IMAGE} -n ${NAMESPACE} 2>/dev/null || {
              kubectl create deployment backend-app --image=${BACKEND_IMAGE} -n ${NAMESPACE}
              kubectl expose deployment backend-app --port=8000 --target-port=8000 -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
            }
          fi
          
          # 프론트엔드 배포 (조건부)  
          if [[ "${FRONTEND_BUILT}" == "true" ]]; then
            echo "🚀 Deploying frontend: ${FRONTEND_IMAGE}"
            kubectl set image deployment/frontend-app frontend-app=${FRONTEND_IMAGE} -n ${NAMESPACE} 2>/dev/null || {
              kubectl create deployment frontend-app --image=${FRONTEND_IMAGE} -n ${NAMESPACE}
              kubectl expose deployment frontend-app --port=3000 --target-port=3000 -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
            }
          fi
          
          echo "✅ Lightning deployment completed"

      - name: 🏥 Quick health check
        timeout-minutes: 1
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          NAMESPACE="club-platform-${ENVIRONMENT}"
          echo "🔍 Quick health check..."
          kubectl get pods -n ${NAMESPACE} --no-headers | head -5
          echo "✅ Health check completed"

  # 📢 간단한 알림
  notify:
    runs-on: ubuntu-latest
    needs: [deploy, security-scan]
    if: always() && (success() || failure())
    timeout-minutes: 2
    
    steps:
      - name: 📊 Generate status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "result=✅ SUCCESS" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "result=❌ FAILED" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Simple notification
        if: env.SLACK_WEBHOOK_URL
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "#cicd-alerts",
              "username": "⚡ Fast CI/CD",
              "icon_emoji": ":rocket:",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "text": "${{ steps.status.outputs.result }} - ${{ github.repository }}@${{ github.ref_name }} by ${{ github.actor }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📊 Pipeline summary
        run: |
          echo "🎯 Pipeline Status: ${{ steps.status.outputs.result }}"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "⏱️ Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"