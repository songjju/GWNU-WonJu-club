name: 🚀 Fast CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 🧪 필수 테스트만 (병렬 실행)
  test:
    name: 🧪 Essential Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 백엔드 빠른 테스트
      - name: 🧪 Backend tests
        timeout-minutes: 5
        env:
          SECRET_KEY: test-key
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test --failfast

      # 프론트엔드 빠른 테스트
      - name: 🧪 Frontend tests
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --silent
          npm test -- --watchAll=false --passWithNoTests

  # 🐳 빌드 (테스트와 병렬)
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 12
    
    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG="${{ github.ref_name }}"
          
          echo "backend-image=${REGISTRY}/${REPO_LOWER}/backend:${BRANCH_TAG}" >> $GITHUB_OUTPUT
          echo "frontend-image=${REGISTRY}/${REPO_LOWER}/frontend:${BRANCH_TAG}" >> $GITHUB_OUTPUT

      # 백엔드 빌드 (병렬)
      - name: 🐳 Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend-image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend
          platforms: linux/amd64

      # 프론트엔드 빌드 (병렬)
      - name: 🐳 Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend-image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend
          platforms: linux/amd64

  # 🚀 수정된 배포
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Create secrets
        env:
          NAMESPACE: "club-platform-staging"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "🔐 시크릿 생성 시작..."
          
          # 네임스페이스 생성
          kubectl create namespace ${NAMESPACE} || echo "네임스페이스 이미 존재"
          
          # 시크릿들 삭제 후 재생성 (더 안전함)
          kubectl delete secret ghcr-secret staging-backend-secrets staging-mysql-secrets -n "${NAMESPACE}" || echo "기존 시크릿 없음"
          
          # ImagePullSecret
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITOPS_TOKEN }}" \
            --namespace="${NAMESPACE}"
          
          # Backend secrets
          kubectl create secret generic staging-backend-secrets \
            --from-literal=secret-key="${SECRET_KEY}" \
            --from-literal=email-host-user="${EMAIL_HOST_USER}" \
            --from-literal=email-host-password="${EMAIL_HOST_PASSWORD}" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}"
          
          # MySQL secrets
          kubectl create secret generic staging-mysql-secrets \
            --from-literal=root-password="${MYSQL_ROOT_PASSWORD}" \
            --from-literal=user-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}"
          
          echo "✅ 모든 시크릿 생성 완료"

      - name: 🚀 Deploy apps with proper health checks
        env:
          NAMESPACE: "club-platform-staging"
        run: |
          cat <<EOF | kubectl apply -f -
          # MySQL 먼저 배포 (다른 앱들이 의존)
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: staging-mysql
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mysql
            template:
              metadata:
                labels:
                  app: mysql
              spec:
                containers:
                - name: mysql
                  image: mysql:8.0
                  ports:
                  - containerPort: 3306
                  env:
                  - name: MYSQL_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mysql-secrets
                        key: root-password
                  - name: MYSQL_DATABASE
                    value: "gwnu_club_db"
                  - name: MYSQL_USER
                    value: "gwnu_user"
                  - name: MYSQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mysql-secrets
                        key: user-password
                  volumeMounts:
                  - name: mysql-storage
                    mountPath: /var/lib/mysql
                  # 🔧 MySQL 헬스체크 수정
                  readinessProbe:
                    exec:
                      command:
                      - mysqladmin
                      - ping
                      - -h
                      - localhost
                      - -u
                      - root
                      - -p\$(MYSQL_ROOT_PASSWORD)
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                  livenessProbe:
                    exec:
                      command:
                      - mysqladmin
                      - ping
                      - -h
                      - localhost
                      - -u
                      - root
                      - -p\$(MYSQL_ROOT_PASSWORD)
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                volumes:
                - name: mysql-storage
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mysql-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: mysql
            ports:
            - port: 3306
              targetPort: 3306
          ---
          # Backend 배포
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: staging-backend
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: backend
                  image: ${{ needs.build.outputs.backend-image }}
                  ports:
                  - containerPort: 8000
                  env:
                  - name: SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: backend-secrets
                        key: secret-key
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: backend-secrets
                        key: db-password
                  - name: DB_HOST
                    value: "mysql-service"
                  - name: DB_NAME
                    value: "gwnu_club_db"
                  - name: DB_USER
                    value: "gwnu_user"
                  - name: DB_PORT
                    value: "3306"
                  - name: DEBUG
                    value: "False"
                  # 🔧 Backend 헬스체크 수정
                  readinessProbe:
                    httpGet:
                      path: /health/
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  livenessProbe:
                    httpGet:
                      path: /health/
                      port: 8000
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3
                  # 🔧 리소스 제한 추가
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: backend
            ports:
            - port: 8000
              targetPort: 8000
          ---
          # Frontend 배포
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: staging-frontend
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: frontend
                  image: ${{ needs.build.outputs.frontend-image }}
                  ports:
                  - containerPort: 3000
                  env:
                  - name: REACT_APP_API_URL
                    value: "http://backend-service:8000"
                  # 🔧 Frontend 헬스체크 수정
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 3000
                    initialDelaySeconds: 20
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 3000
                    initialDelaySeconds: 30
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "200m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: frontend
            ports:
            - port: 3000
              targetPort: 3000
          EOF

          echo "✅ 배포 완료 - 헬스체크 개선됨"

      - name: 🔍 배포 상태 확인
        env:
          NAMESPACE: "club-platform-staging"
        run: |
          echo "📋 배포 상태 확인 중..."
          
          # 잠시 대기 후 상태 확인
          sleep 30
          
          echo "🔍 Pod 상태:"
          kubectl get pods -n ${NAMESPACE}
          
          echo ""
          echo "🔍 서비스 상태:"
          kubectl get services -n ${NAMESPACE}
          
          echo ""
          echo "🔍 시크릿 상태:"
          kubectl get secrets -n ${NAMESPACE}