name: 🚀 Fast CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # 🧪 필수 테스트만 (병렬 실행)
  test:
    name: 🧪 Essential Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 백엔드 빠른 테스트
      - name: 🧪 Backend tests
        timeout-minutes: 5
        env:
          SECRET_KEY: test-key
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py test --failfast

      # 프론트엔드 빠른 테스트
      - name: 🧪 Frontend tests
        timeout-minutes: 3
        run: |
          cd frontend
          npm ci --silent
          npm test -- --watchAll=false --passWithNoTests

  # 🐳 빌드 (테스트와 병렬)
  build:
    name: 🐳 Build Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 12
    
    outputs:
      backend-image: ${{ steps.meta.outputs.backend-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG="${{ github.ref_name }}"
          
          echo "backend-image=${REGISTRY}/${REPO_LOWER}/backend:${BRANCH_TAG}" >> $GITHUB_OUTPUT
          echo "frontend-image=${REGISTRY}/${REPO_LOWER}/frontend:${BRANCH_TAG}" >> $GITHUB_OUTPUT

      # 백엔드 빌드 (병렬)
      - name: 🐳 Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend-image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend
          platforms: linux/amd64

      # 프론트엔드 빌드 (병렬)
      - name: 🐳 Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend-image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend
          platforms: linux/amd64

  # 🚀 진단 및 배포
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 클러스터 정보 확인
        run: |
          echo "==================== 🔍 클러스터 진단 시작 ===================="
          
          # 현재 kubectl context 확인
          echo "📋 현재 kubectl context:"
          kubectl config current-context || echo "❌ kubectl context 없음"
          
          # 사용 가능한 모든 context 확인
          echo ""
          echo "📋 사용 가능한 모든 contexts:"
          kubectl config get-contexts || echo "❌ contexts 조회 실패"
          
          # 클러스터 정보
          echo ""
          echo "🔗 클러스터 정보:"
          kubectl cluster-info || echo "❌ 클러스터 정보 조회 실패"
          
          # 현재 네임스페이스 확인
          echo ""
          echo "📦 현재 네임스페이스:"
          kubectl config view --minify --output 'jsonpath={..namespace}' || echo "default"
          
          # 모든 네임스페이스 조회
          echo ""
          echo "📦 모든 네임스페이스:"
          kubectl get namespaces || echo "❌ 네임스페이스 조회 실패"
          
          # club-platform-staging 네임스페이스 확인
          echo ""
          echo "🎯 club-platform-staging 네임스페이스 상태:"
          kubectl get namespace club-platform-staging || echo "❌ club-platform-staging 없음"
          
          # 기존 시크릿 확인
          echo ""
          echo "🔑 club-platform-staging의 기존 시크릿들:"
          kubectl get secrets -n club-platform-staging || echo "❌ 네임스페이스 없거나 시크릿 없음"
          
          echo "==================== 🔍 클러스터 진단 완료 ===================="

      - name: 🔑 Create secrets
        env:
          NAMESPACE: "club-platform-staging"
          # 모든 시크릿을 환경변수로 명시적 설정
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "==================== 🔐 시크릿 생성 시작 ===================="
          echo "🎯 타겟 네임스페이스: ${NAMESPACE}"
          echo "🌟 브랜치 이름: ${{ github.ref_name }}"
          
          # 환경변수 확인 (값은 숨김)
          echo "🔐 환경변수 존재 확인:"
          [ -n "$SECRET_KEY" ] && echo "  ✅ SECRET_KEY 설정됨 (${#SECRET_KEY} 문자)" || echo "  ❌ SECRET_KEY 비어있음"
          [ -n "$EMAIL_HOST_USER" ] && echo "  ✅ EMAIL_HOST_USER 설정됨" || echo "  ❌ EMAIL_HOST_USER 비어있음"
          [ -n "$EMAIL_HOST_PASSWORD" ] && echo "  ✅ EMAIL_HOST_PASSWORD 설정됨" || echo "  ❌ EMAIL_HOST_PASSWORD 비어있음"
          [ -n "$DB_PASSWORD" ] && echo "  ✅ DB_PASSWORD 설정됨" || echo "  ❌ DB_PASSWORD 비어있음"
          [ -n "$MYSQL_ROOT_PASSWORD" ] && echo "  ✅ MYSQL_ROOT_PASSWORD 설정됨" || echo "  ❌ MYSQL_ROOT_PASSWORD 비어있음"
          
          # 네임스페이스 생성 (자세한 로그)
          echo ""
          echo "📦 네임스페이스 생성/확인 중..."
          if kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1; then
            echo "  ✅ 네임스페이스 ${NAMESPACE} 이미 존재함"
          else
            echo "  🆕 네임스페이스 ${NAMESPACE} 생성 중..."
            kubectl create namespace "${NAMESPACE}" && echo "  ✅ 네임스페이스 생성 성공" || echo "  ❌ 네임스페이스 생성 실패"
          fi
          
          # 각 시크릿을 개별적으로 생성하고 확인
          echo ""
          echo "🔑 ImagePullSecret 생성 중..."
          if kubectl get secret ghcr-secret -n "${NAMESPACE}" >/dev/null 2>&1; then
            echo "  🗑️ 기존 ghcr-secret 삭제 중..."
            kubectl delete secret ghcr-secret -n "${NAMESPACE}"
          fi
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITOPS_TOKEN }}" \
            --namespace="${NAMESPACE}" && echo "  ✅ ghcr-secret 생성 성공" || echo "  ❌ ghcr-secret 생성 실패"
          
          echo ""
          echo "🔑 Backend secrets 생성 중..."
          if kubectl get secret backend-secrets -n "${NAMESPACE}" >/dev/null 2>&1; then
            echo "  🗑️ 기존 backend-secrets 삭제 중..."
            kubectl delete secret backend-secrets -n "${NAMESPACE}"
          fi
          kubectl create secret generic backend-secrets \
            --from-literal=secret-key="${SECRET_KEY}" \
            --from-literal=email-host-user="${EMAIL_HOST_USER}" \
            --from-literal=email-host-password="${EMAIL_HOST_PASSWORD}" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" && echo "  ✅ backend-secrets 생성 성공" || echo "  ❌ backend-secrets 생성 실패"
          
          echo ""
          echo "🔑 MySQL secrets 생성 중..."
          if kubectl get secret mysql-secrets -n "${NAMESPACE}" >/dev/null 2>&1; then
            echo "  🗑️ 기존 mysql-secrets 삭제 중..."
            kubectl delete secret mysql-secrets -n "${NAMESPACE}"
          fi
          kubectl create secret generic mysql-secrets \
            --from-literal=root-password="${MYSQL_ROOT_PASSWORD}" \
            --from-literal=user-password="${DB_PASSWORD}" \
            --namespace="${NAMESPACE}" && echo "  ✅ mysql-secrets 생성 성공" || echo "  ❌ mysql-secrets 생성 실패"
          
          # 최종 확인
          echo ""
          echo "🔍 생성 결과 확인:"
          kubectl get secrets -n "${NAMESPACE}" || echo "  ❌ 시크릿 조회 실패"
          
          # 각 시크릿의 세부 정보 확인
          echo ""
          echo "🔍 각 시크릿 상세 확인:"
          for secret in ghcr-secret backend-secrets mysql-secrets; do
            if kubectl get secret "${secret}" -n "${NAMESPACE}" >/dev/null 2>&1; then
              echo "  ✅ ${secret} 존재 확인"
              kubectl get secret "${secret}" -n "${NAMESPACE}" -o jsonpath='{.metadata.name}: {.data}' | head -c 100
              echo ""
            else
              echo "  ❌ ${secret} 존재하지 않음"
            fi
          done
          
          echo "==================== 🔐 시크릿 생성 완료 ===================="

      - name: 🚀 Deploy apps
        env:
          NAMESPACE: "club-platform-staging"
        run: |
          echo "🚀 애플리케이션 배포는 스킵 (시크릿 생성 테스트용)"
          echo "✅ 배포 스킵됨"